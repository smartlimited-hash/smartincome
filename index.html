<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  padding: 20px;
}

.container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

h2 {
  text-align: center;
  color: #0b57d0;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

textarea {
  height: 120px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  background: #0b57d0;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

#success {
  display: none;
  text-align: center;
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  background: #e8f5e9;
  color: #16803c;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>Transaction</h2>

  <form id="transactionForm">

    <label>Number</label>
    <input type="tel" placeholder="Enter phone number" required>

    <label>Email</label>
    <input type="email" placeholder="Enter email address" required>

    <label>Amount to Withdraw</label>
    <input type="number" placeholder="Enter amount" required>

    <label>Paste Message</label>
    <textarea placeholder="Paste transaction message here..." required></textarea>

    <button type="submit">Submit Transaction</button>

  </form>

  <div id="success">
    ✓ Transaction Successful
  </div>
</div>

<script>
document.getElementById("transactionForm").addEventListener("submit", function(e) {
  e.preventDefault();

  this.style.display = "none";
  document.getElementById("success").style.display = "block";
});
</script>

</body>
</html>
